<div class="auth-page">

  <!-- Animated music background -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- ── Header bar ─────────────────────────────────────────────────── -->
  <header class="auth-header">
    <button class="back-btn" routerLink="/music" title="Back to Home">
      <svg viewBox="0 0 24 24">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
    <span class="auth-header-logo">
      <span class="logo-icon">🎵</span>
      <span class="logo-text">StreamPlay</span>
    </span>
    <div class="spacer"></div>
  </header>

  <!-- ── Card ───────────────────────────────────────────────────────── -->
  <div class="auth-card">

    <!-- Icon -->
    <div class="auth-icon-wrap">
      <svg viewBox="0 0 24 24" class="auth-icon">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
      </svg>
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue to StreamPlay</p>

    <!-- Error / Success -->
    <div class="alert alert-error" *ngIf="errorMessage">
      <span>⚠</span> {{ errorMessage }}
    </div>

    <!-- Form -->
    <form class="auth-form" (ngSubmit)="onSubmit()">

      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <polyline points="2,4 12,13 22,4" />
          </svg>
          <input class="field-input" type="email" placeholder="your@email.com" [(ngModel)]="email" name="email"
            autocomplete="email" required />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input class="field-input" [type]="isPasswordVisible ? 'text' : 'password'" placeholder="••••••••"
            [(ngModel)]="password" name="password" autocomplete="current-password" required />
          <button type="button" class="eye-btn" (click)="togglePasswordVisibility()">
            <svg viewBox="0 0 24 24" *ngIf="!isPasswordVisible">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg viewBox="0 0 24 24" *ngIf="isPasswordVisible">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <button class="submit-btn" type="submit" [disabled]="isLoading">
        <span class="btn-spinner" *ngIf="isLoading"></span>
        <span *ngIf="!isLoading">Log In</span>
        <span *ngIf="isLoading">Signing in…</span>
      </button>

    </form>

    <p class="auth-switch">
      Don't have an account?
      <button class="switch-link" (click)="goToSignup()">Sign Up</button>
    </p>

  </div>

  <!-- ── Home shortcut (mobile-friendly) ───────────────────────────── -->
  <button class="home-fab" routerLink="/music" title="Go to Home">
    <svg viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
  </button>

</div>
