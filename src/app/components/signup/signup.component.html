<div class="signup-container">
    <div class="signup-card">
        <div class="signup-header">
            <h1>Create Account</h1>
            <p>Join ChatMe today</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="signup-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" [(ngModel)]="name" name="name" placeholder="Enter your full name" required
                    [disabled]="isLoading" />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required
                    [disabled]="isLoading" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Enter your password (min 6 characters)" required [disabled]="isLoading" />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword"
                    placeholder="Confirm your password" required [disabled]="isLoading" />
            </div>

            <div class="form-group">
                <label for="role">Account Type</label>
                <select id="role" [(ngModel)]="role" name="role" [disabled]="isLoading">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
                <small class="role-info">Note: Only one admin account is allowed</small>
            </div>

            <div class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <div class="success-message" *ngIf="successMessage">
                {{ successMessage }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="isLoading">
                <span *ngIf="!isLoading">Sign Up</span>
                <span *ngIf="isLoading">Creating account...</span>
            </button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a (click)="goToLogin()">Login</a></p>
        </div>
    </div>
</div>
