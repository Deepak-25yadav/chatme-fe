<div class="auth-page">

    <!-- Animated music background -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- ── Header bar ─────────────────────────────────────────────────── -->
    <header class="auth-header">
        <button class="back-btn" routerLink="/music" title="Back to Home">
            <svg viewBox="0 0 24 24">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>
        <span class="auth-header-logo">
            <span class="logo-icon">🎵</span>
            <span class="logo-text">StreamPlay</span>
        </span>
        <div class="spacer"></div>
    </header>

    <!-- ── Card ───────────────────────────────────────────────────────── -->
    <div class="auth-card">

        <!-- Icon -->
        <div class="auth-icon-wrap">
            <svg viewBox="0 0 24 24" class="auth-icon">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
                <line x1="19" y1="8" x2="19" y2="14" />
                <line x1="22" y1="11" x2="16" y2="11" />
            </svg>
        </div>

        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Join StreamPlay and enjoy music</p>

        <!-- Error / Success -->
        <div class="alert alert-error" *ngIf="errorMessage"> <span>⚠</span> {{ errorMessage }} </div>
        <div class="alert alert-success" *ngIf="successMessage"> <span>✓</span> {{ successMessage }} </div>

        <!-- Form -->
        <form class="auth-form" (ngSubmit)="onSubmit()">

            <div class="field-group">
                <label class="field-label">Full Name</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    <input class="field-input" type="text" placeholder="Your full name" [(ngModel)]="name" name="name"
                        autocomplete="name" required />
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">Email</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <polyline points="2,4 12,13 22,4" />
                    </svg>
                    <input class="field-input" type="email" placeholder="your@email.com" [(ngModel)]="email"
                        name="email" autocomplete="email" required />
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">Password</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input class="field-input" type="password" placeholder="Min. 6 characters" [(ngModel)]="password"
                        name="password" autocomplete="new-password" required />
                </div>
            </div>

            <div class="field-group">
                <label class="field-label">Confirm Password</label>
                <div class="field-wrap">
                    <svg class="field-icon" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                    <input class="field-input" type="password" placeholder="Repeat password"
                        [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" required />
                </div>
            </div>

            <button class="submit-btn" type="submit" [disabled]="isLoading">
                <span class="btn-spinner" *ngIf="isLoading"></span>
                <span *ngIf="!isLoading">Create Account</span>
                <span *ngIf="isLoading">Creating…</span>
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <button class="switch-link" (click)="goToLogin()">Log In</button>
        </p>

    </div>

    <!-- ── Home shortcut (mobile-friendly) ───────────────────────────── -->
    <button class="home-fab" routerLink="/music" title="Go to Home">
        <svg viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
    </button>

</div>
