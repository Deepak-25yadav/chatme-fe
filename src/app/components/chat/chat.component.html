<div class="chat-container" [class.mobile]="isMobileView">
  <div
    class="user-list-panel"
    [class.mobile]="isMobileView"
    [class.visible]="isUserListVisible"
    [class.hidden]="isMobileView && !isUserListVisible">
    <div class="mobile-user-list-header" *ngIf="isMobileView">
      <h2>Chats</h2>
      <button class="icon-button ghost" (click)="toggleUserList(false)" aria-label="Close conversation list">
        &times;
      </button>
    </div>
    <app-user-list
      [users]="users"
      [currentUser]="currentUser"
      [selectedUser]="selectedUser"
      [onlineUsers]="onlineUsers"
      [userLastSeen]="userLastSeen"
      (userSelected)="selectUser($event)">
    </app-user-list>
  </div>

  <div
    class="mobile-overlay"
    *ngIf="isMobileView && isUserListVisible"
    (click)="toggleUserList(false)">
  </div>

  <div class="chat-panel" [class.mobile]="isMobileView" *ngIf="selectedUser; else noSelection">
    <div class="chat-header">
      <div class="header-left">
        <button
          class="icon-button ghost"
          *ngIf="isMobileView"
          (click)="toggleUserList(true)"
          aria-label="Open conversation list">
          &#9776;
        </button>
        <div class="user-info">
          <div class="avatar">{{ selectedUser.name.charAt(0).toUpperCase() }}</div>
          <div class="user-details">
            <h3>{{ selectedUser.name }}</h3>
            <p class="status">
              <span *ngIf="isUserOnline(selectedUser.userId)" class="online">online</span>
              <span *ngIf="!isUserOnline(selectedUser.userId)" class="offline">
                last seen {{ formatLastSeen(getLastSeen(selectedUser.userId) || selectedUser.lastSeen) }}
              </span>
            </p>
          </div>
        </div>
      </div>
      <div class="header-actions" *ngIf="currentUser">
        <button class="logout-btn" (click)="logout()" title="Logout">
          Logout
        </button>
      </div>
    </div>

    <app-message-list
      [messages]="messages"
      [currentUser]="currentUser"
      [selectedUser]="selectedUser"
      [isTyping]="isUserTyping()"
      (editMessage)="editMessage($event.message, $event.newText)"
      (deleteMessage)="deleteMessage($event.message, $event.deleteFor)"
      (replyToMessage)="handleReply($event)">
    </app-message-list>

    <app-message-input
      [selectedUser]="selectedUser"
      [replyTo]="replyToMessage"
      (sendMessage)="onSendMessage($event)"
      (typing)="onTyping($event)">
    </app-message-input>
  </div>

  <ng-template #noSelection>
    <div class="chat-panel" [class.mobile]="isMobileView">
      <div class="chat-header">
        <div class="header-left">
          <button
            class="icon-button ghost"
            *ngIf="isMobileView"
            (click)="toggleUserList(true)"
            aria-label="Open conversation list">
            &#9776;
          </button>
          <div class="user-info">
            <h3>ChatMe</h3>
          </div>
        </div>
        <div class="header-actions" *ngIf="currentUser">
          <button class="logout-btn" (click)="logout()" title="Logout">
            Logout
          </button>
        </div>
      </div>
      <div class="no-selection">
        <p>Select a user to start chatting</p>
      </div>
    </div>
  </ng-template>
</div>
